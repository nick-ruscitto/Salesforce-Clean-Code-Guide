<template>
	<article class="slds-card">
		<div class="slds-card__header slds-grid">
			<header class="slds-media slds-media_center slds-has-flexi-truncate">
				<div class="slds-media__figure">
					<lightning-icon icon-name="standard:contact" size="small"></lightning-icon>
				</div>
				<div class="slds-media__body">
					<h2 class="slds-card__header-title">
						<span>Contacts ({contactCount})</span>
					</h2>
				</div>
			</header>
			<div class="slds-no-flex">
				<lightning-button
					variant="brand"
					label="New Contact"
					onclick={handleNewContact}
					icon-name="utility:add"
				></lightning-button>
			</div>
		</div>
		<div class="slds-card__body slds-card__body_inner">
			<template if:true={errorMessage}>
				<div class="slds-notify slds-notify_alert slds-theme_error" role="alert">
					<span class="slds-assistive-text">error</span>
					<h2>{errorMessage}</h2>
				</div>
			</template>

			<template if:true={showNewContactForm}>
				<div class="slds-m-bottom_medium">
					<c-new-contact-form
						account-id={accountId}
						oncontactsaved={handleContactSaved}
						oncancel={handleCancelNewContact}
					></c-new-contact-form>
				</div>
			</template>

			<template if:true={hasContacts}>
				<div class="slds-grid slds-wrap slds-gutters">
					<template for:each={contacts} for:item="contact">
						<div key={contact.Id} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-3">
							<article class="slds-card slds-m-bottom_small">
								<div class="slds-card__body slds-card__body_inner">
									<dl class="slds-list_horizontal slds-wrap">
										<dt class="slds-item_label slds-text-color_weak slds-truncate">Name:</dt>
										<dd class="slds-item_detail slds-truncate">
											{contact.FirstName} {contact.LastName}
										</dd>
										<dt class="slds-item_label slds-text-color_weak slds-truncate">Email:</dt>
										<dd class="slds-item_detail slds-truncate">{contact.Email}</dd>
									</dl>
								</div>
							</article>
						</div>
					</template>
				</div>
			</template>

			<template if:false={hasContacts}>
				<div class="slds-align_absolute-center slds-p-vertical_large">
					<p class="slds-text-color_weak">No contacts found for this account.</p>
				</div>
			</template>
		</div>
	</article>
</template>
