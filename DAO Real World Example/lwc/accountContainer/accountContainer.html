<template>
	<lightning-card title="Account Overview" icon-name="standard:account">
		<div class="slds-p-around_medium">
			<template lwc:if={errorMessage}>
				<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
					<span class="slds-assistive-text">error</span>
					<h2>{errorMessage}</h2>
				</div>
			</template>

			<template lwc:if={account}>
				<!-- Account Details Section -->
				<c-account-details account={account}></c-account-details>

				<!-- Contact List Section -->
				<div class="slds-m-top_large">
					<c-account-contact-list
						account-id={recordId}
						oncontactcreated={refreshContactList}
					></c-account-contact-list>
				</div>
			</template>

			<template lwc:else>
				<lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
			</template>
		</div>
	</lightning-card>
</template>
