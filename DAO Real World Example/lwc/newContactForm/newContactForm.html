<template>
	<lightning-card title="New Contact" icon-name="standard:contact">
		<div class="slds-p-around_medium">
			<template if:true={successMessage}>
				<div class="slds-notify slds-notify_alert slds-theme_success slds-m-bottom_medium" role="alert">
					<span class="slds-assistive-text">success</span>
					<h2>{successMessage}</h2>
				</div>
			</template>

			<template if:true={errorMessage}>
				<div class="slds-notify slds-notify_alert slds-theme_error slds-m-bottom_medium" role="alert">
					<span class="slds-assistive-text">error</span>
					<h2>{errorMessage}</h2>
				</div>
			</template>

			<lightning-input
				label="First Name"
				value={firstName}
				onchange={handleFirstNameChange}
			></lightning-input>

			<lightning-input
				label="Last Name"
				value={lastName}
				onchange={handleLastNameChange}
				required
			></lightning-input>

			<lightning-input
				label="Email"
				type="email"
				value={email}
				onchange={handleEmailChange}
			></lightning-input>

			<div class="slds-m-top_medium">
				<lightning-button
					variant="brand"
					label="Save Contact"
					onclick={handleSave}
					disabled={isSaving}
				></lightning-button>
				<lightning-button
					label="Cancel"
					onclick={handleCancel}
					disabled={isSaving}
					class="slds-m-left_small"
				></lightning-button>
			</div>
		</div>
	</lightning-card>
</template>
